name: Selenium TestNG CI and Docker Hub Push

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Compile, run Selenium + TestNG tests in Headless Chrome, and package JAR
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Selenium TestNG tests and package JAR
        run: mvn -B clean package

      - name: Upload packaged JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-login-jar
          path: target/selenium-login-test-1.0-SNAPSHOT.jar

  # Job 2: Build Docker image and push to Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download packaged JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: selenium-login-jar
          path: target

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/selenium-login-test:latest
